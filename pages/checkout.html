<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Hearth &amp; Crumb Bakery</title>
<meta name="description" content="Check out at Hearth &amp; Crumb Bakery: choose your bakery and pickup time, then pay with a test card.">
<style>@view-transition { navigation: auto; }</style>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/site.css">
<link rel="stylesheet" href="../css/shop/core.css">

<body class="page-checkout">
<a class="skip-link" href="#checkout-main">Skip to checkout</a>
<header class="site-header" id="site-header"></header>
<main id="checkout-main" class="co">
  <h1>Checkout</h1>
  <div id="co-banner" role="status" aria-live="polite"></div>
  <p class="shop-notice co-demo"><strong>Demo shop: test payments only. No real money moves.</strong> Use card 4242 4242 4242 4242 with any future expiry and any 3-digit code.</p>
  <noscript><p class="shop-notice">Checkout needs JavaScript. Without it, you can still read the menu.</p></noscript>
  <div id="co-root" class="co-grid"><p class="shop-muted">Loading your cart…</p></div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../js/nav.js" defer></script>
<script src="../js/motion.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/shop/core.js" defer></script>
<script src="../js/shop/cart.js" defer></script>
<script src="../js/shop/checkout.js" defer></script>
